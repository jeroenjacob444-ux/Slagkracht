<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slagkracht</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;font-family:Arial,sans-serif;touch-action:none}
*{box-sizing:border-box}
canvas{width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061426cc;z-index:10}
.card{width:min(88vw,390px);padding:28px;border-radius:26px;text-align:center;background:#102943;border:1px solid #52779b;box-shadow:0 18px 60px #0009;color:#fff}
h1{font-size:42px;margin:0 0 8px}h2{font-size:30px;margin:0 0 8px}
p{color:#d2dfec;line-height:1.45}
button{appearance:none;border:0;border-radius:17px;padding:17px 30px;background:#ffd52e;color:#17202b;font-size:20px;font-weight:900;box-shadow:0 6px 0 #b28f08;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #b28f08}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu" class="overlay"><div class="card">
<h1>🏏 SLAGKRACHT</h1>
<p><b>Sla zo ver mogelijk!</b><br>Timing bepaalt je startsnelheid. Daarna stuur je links en rechts om obstakels te ontwijken.</p>
<button id="startBtn">START SPEL</button>
<p style="font-size:13px">Tip: speel liggend of rechtop — beide werken.</p>
</div></div>
<div id="over" class="overlay hidden"><div class="card">
<h2>🏆 EINDE</h2><div id="distance" style="font-size:34px;font-weight:900"></div>
<p id="record"></p><button id="againBtn">OPNIEUW</button>
</div></div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,scale=1,mode='menu',meter=.1,dir=1,score=0,speed=0,player=.5,offset=0,spawn=0,last=0,shake=0;
let obstacles=[];
let best=parseFloat(localStorage.getItem('slagkracht-best')||'0');

function resize(){
 W=innerWidth;H=innerHeight;scale=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(W*scale);canvas.height=Math.floor(H*scale);
 ctx.setTransform(scale,0,0,scale,0,0);
}
addEventListener('resize',resize);resize();

function begin(){
 mode='aim';meter=.1;dir=1;score=0;speed=0;player=.5;offset=0;spawn=0;obstacles=[];
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('over').classList.add('hidden');
}
document.getElementById('startBtn').addEventListener('click',begin);
document.getElementById('startBtn').addEventListener('touchend',function(e){e.preventDefault();begin()},{passive:false});
document.getElementById('againBtn').addEventListener('click',begin);
document.getElementById('againBtn').addEventListener('touchend',function(e){e.preventDefault();begin()},{passive:false});

canvas.addEventListener('pointerdown',function(e){
 if(mode==='aim')hit();
 else if(mode==='slide'){
   player += e.clientX<W/2 ? -.13 : .13;
   player=Math.max(.17,Math.min(.83,player));
 }
});

function hit(){
 const d=Math.abs(meter-.5);
 let quality=Math.max(0,1-d/.5);
 speed=8+quality*25;
 if(d<.055)speed+=8;
 mode='slide';
}
function obstacle(){
 const lanes=[.25,.5,.75];
 obstacles.push({x:lanes[Math.floor(Math.random()*3)],y:-50,r:20+Math.random()*10,type:Math.random()<.55?'rock':'cone'});
}
function finish(){
 mode='over';
 if(score>best){best=score;localStorage.setItem('slagkracht-best',best.toFixed(1));}
 document.getElementById('distance').textContent=score.toFixed(1)+' meter';
 document.getElementById('record').textContent='Beste afstand: '+best.toFixed(1)+' meter';
 document.getElementById('over').classList.remove('hidden');
}
function update(dt){
 if(mode==='aim'){
  meter+=dir*dt*.8;
  if(meter>=1){meter=1;dir=-1}
  if(meter<=0){meter=0;dir=1}
 }
 if(mode==='slide'){
  score+=speed*dt*1.35;
  speed*=Math.pow(.985,dt*60);
  offset+=speed*dt*60;
  spawn-=dt;
  if(spawn<=0){obstacle();spawn=Math.max(.35,1.0-speed/40)}
  obstacles.forEach(o=>o.y+=(70+speed*18)*dt);
  const px=W*player,py=H*.77;
  for(const o of obstacles){
   if(Math.abs(px-W*o.x)<o.r+17 && Math.abs(py-o.y)<o.r+28){
    speed*=.48;shake=8;o.y+=100;
   }
  }
  obstacles=obstacles.filter(o=>o.y<H+80);
  if((speed<2.2 && score>3)||score>=1000)finish();
 }
 if(shake>0)shake*=.86;
}
function round(x,y,w,h,r,fill){
 ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function draw(){
 ctx.save();
 if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1681d1');bg.addColorStop(.5,'#9bdff0');bg.addColorStop(1,'#e3f8fa');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // mountains
 ctx.fillStyle='#effaff';ctx.beginPath();ctx.moveTo(0,H*.34);ctx.lineTo(W*.18,H*.10);ctx.lineTo(W*.32,H*.32);ctx.lineTo(W*.48,H*.12);ctx.lineTo(W*.65,H*.31);ctx.lineTo(W*.82,H*.08);ctx.lineTo(W,H*.3);ctx.lineTo(W,H*.48);ctx.lineTo(0,H*.48);ctx.fill();
 // track
 ctx.fillStyle='#bdebf1';ctx.beginPath();ctx.moveTo(W*.06,H);ctx.lineTo(W*.35,H*.39);ctx.lineTo(W*.65,H*.39);ctx.lineTo(W*.94,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#ffffff88';ctx.lineWidth=2;
 for(let y=H*.44+(offset%85);y<H;y+=85){ctx.beginPath();ctx.moveTo(W*.13,y);ctx.lineTo(W*.87,y);ctx.stroke();}
 // signs
 ctx.font='bold 15px Arial';ctx.textAlign='center';
 for(let n=100;n<=500;n+=100){
  let y=H*.74-(n-score)*2.0;
  if(y>H*.38&&y<H*.9){round(W*.13,y-14,65,30,5,'#18395b');ctx.fillStyle='#fff';ctx.fillText(n+'m',W*.162,y+7);}
 }
 if(mode==='aim')drawAim();else if(mode==='slide')drawSlide();
 // HUD
 round(14,14,150,62,17,'#071b30cc');ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 13px Arial';ctx.fillText('🏆 BESTE',28,36);ctx.font='bold 23px Arial';ctx.fillText(best.toFixed(1)+' m',28,61);
 if(mode==='slide'){round(W-165,14,151,62,17,'#071b30cc');ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.fillText('AFSTAND',W-149,36);ctx.font='bold 23px Arial';ctx.fillText(score.toFixed(1)+' m',W-149,61);}
 ctx.restore();
}
function drawAim(){
 ctx.textAlign='center';ctx.fillStyle='#102a43';ctx.font='900 28px Arial';ctx.fillText('TIMING',W/2,H*.49);
 const x=W*.11,y=H*.55,w=W*.78,h=30;
 round(x,y,w,h,16,'#d94a3d');ctx.fillStyle='#e9bf29';ctx.fillRect(x+w*.25,y,w*.5,h);ctx.fillStyle='#65d33d';ctx.fillRect(x+w*.44,y,w*.12,h);
 ctx.fillStyle='#fff';ctx.fillRect(x+w*meter-4,y-8,8,h+16);
 // player + club + ball
 ctx.fillStyle='#202b35';ctx.beginPath();ctx.arc(W/2,H*.72,26,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#d9a05b';ctx.fillRect(W/2-8,H*.74,16,72);
 ctx.strokeStyle='#98632e';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(W/2+8,H*.80);ctx.lineTo(W*.67,H*.86);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W*.68,H*.86,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#102a43';ctx.font='bold 16px Arial';ctx.fillText('TIK IN DE GROENE ZONE',W/2,H*.93);
}
function drawSlide(){
 // obstacles
 for(const o of obstacles){
  if(o.type==='rock'){ctx.fillStyle='#506974';ctx.beginPath();ctx.arc(W*o.x,o.y,o.r,0,Math.PI*2);ctx.fill();}
  else{ctx.fillStyle='#ed7039';ctx.beginPath();ctx.moveTo(W*o.x,o.y-o.r);ctx.lineTo(W*o.x-o.r*.7,o.y+o.r);ctx.lineTo(W*o.x+o.r*.7,o.y+o.r);ctx.closePath();ctx.fill();}
 }
 // ball
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W*player,H*.77,16,0,Math.PI*2);ctx.fill();
 round(W*.31,92,W*.38,54,16,'#08213bcc');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 27px Arial';ctx.fillText(score.toFixed(1)+' m',W/2,127);
 ctx.font='bold 14px Arial';ctx.fillText('TIK LINKS / RECHTS OM TE STUREN',W/2,H-24);
}
function loop(now){
 const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
